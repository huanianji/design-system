<!doctype html>
<html lang="zh-CN" data-profile="management" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>华年集 · 管理与创作工作台</title><link rel="icon" href="data:,"><link id="tokens" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="fragments.css"><link rel="stylesheet" href="../components/web/dynamic-icon.css"><link rel="stylesheet" href="../components/web/inputs.css"><script type="module" src="fragments.js"></script></head>
<body><div class="shell fragments">
  <nav class="toolbar" aria-label="工作台预览设置"><span id="source-status" role="status">正在读取共同源…</span><div class="direction-tabs" role="group" aria-label="界面方向"><button id="management-view" aria-pressed="true"><span class="surface">管理工作台</span></button><button id="creative-view" aria-pressed="false"><span class="surface">创作工作台</span></button></div><button id="mode"><span class="surface">切换深色</span></button><button id="text-scale"><span class="surface">字号 125%</span></button><button id="reduce" aria-pressed="false"><span class="surface">减少动态</span></button><button id="simulate-failure" aria-pressed="false"><span class="surface">模拟保存失败</span></button><button id="reload"><span class="surface">重新读取设计</span></button></nav>
  <p id="design-error" role="alert" hidden></p>
  <main id="workspace" class="workspace" hidden>
    <section id="management" aria-labelledby="management-title">
      <header class="workspace-head"><div><h1 id="management-title">今晚的开播安排</h1><p class="muted">先把小事安排好，再安心迎接每一场直播。</p></div><button id="attention-action" class="primary"><span class="surface"><span id="reminder-icon"></span><span>查看待确认</span></span></button></header>
      <div class="roster-tools"><label class="search"><span class="sr-only">搜索主播或场次</span><input id="query" type="search" placeholder="搜索主播或场次" autocomplete="off"></label><div id="status-filters" class="filter-group" role="group" aria-label="开播状态筛选"></div></div>
      <div class="management-grid"><section class="roster-region" aria-label="主播名单"><div class="region-caption"><h2>主播名单</h2><span id="result-count" class="muted" role="status"></span></div><div class="table-scroll"><table><thead><tr><th scope="col">主播</th><th scope="col">开播时段</th><th scope="col">状态</th><th scope="col">准备</th></tr></thead><tbody id="roster-body"></tbody></table></div><p id="roster-empty" class="empty" hidden>没有符合条件的主播。试试其他关键词或状态。</p></section>
      <aside id="detail" class="detail" aria-label="主播准备详情"><div id="detail-content"><div class="detail-heading"><div><p class="muted">开播准备</p><h2 id="detail-name"></h2></div><span id="detail-status" class="status-label"></span></div><dl class="detail-facts"><div><dt>时段</dt><dd id="detail-slot"></dd></div><div><dt>内容</dt><dd id="detail-topic"></dd></div></dl><button id="microphone" aria-pressed="true"><span class="surface"><span id="microphone-icon"></span><span id="microphone-label">麦克风开启</span></span></button><div class="region-caption"><h3>准备事项</h3><span id="ready-count" class="muted" aria-live="polite"></span></div><div id="detail-checks"></div><button id="note-toggle" aria-expanded="false" aria-controls="note-region"><span class="surface"><span>展开开播备注</span><span class="note-chevron"></span></span></button><div id="note-region" class="note-region" inert><div class="note-inner"><label for="note" class="muted">开播备注</label><textarea id="note" rows="3" disabled></textarea><button id="save-note" class="primary"><span class="surface">保存备注</span></button><p id="note-message" class="muted" role="status"></p></div></div></div><p id="detail-empty" class="empty" hidden>选择一位主播，查看准备事项。</p></aside></div>
    </section>
    <section id="creative" aria-labelledby="creative-title" hidden>
      <header class="workspace-head"><div><h1 id="creative-title">给直播间换一点新鲜感</h1><p class="muted">选一份素材，在预览里找到合适的位置和轻重。</p></div><span class="content-label">素材预览</span></header>
      <div class="creative-grid"><section class="preview-column" aria-label="素材与预览"><div class="preview-heading"><h2 id="asset-title"></h2><span class="muted">1280 × 720</span></div><div id="canvas" class="canvas-view" role="img" aria-label="素材预览画布"><img id="art" alt=""></div><div class="library-heading"><h3>选择素材</h3><div id="category-filters" class="filter-group" role="group" aria-label="素材分类"></div></div><div id="asset-strip" class="asset-strip"></div></section>
      <aside class="inspector" aria-label="预览参数"><div><p class="muted">当前素材</p><h2 id="inspector-name"></h2><p id="asset-description" class="muted"></p></div><div class="param"><label for="zoom">缩放 <output id="zoom-value">100%</output></label><input id="zoom" type="range" min="50" max="140" value="100"></div><div class="param"><label for="opacity">透明度 <output id="opacity-value">100%</output></label><input id="opacity" type="range" min="0" max="100" value="100"></div><button id="reset-preview"><span class="surface">重置预览</span></button><p id="preview-status" class="muted" role="status">默认预览</p><p class="muted inspector-note">参数只影响这里的预览，原素材保持不变。</p></aside></div>
    </section>
    <footer class="muted"><span>华年集出品</span><span id="disclaimer"></span><span>本地状态演示 · 不连接麦克风设备或业务服务</span></footer>
  </main>
</div></body></html>
