<!doctype html>
<html lang="zh-CN" data-profile="management" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>华年集 · 输入与验证码</title><link rel="icon" href="data:,"><link id="tokens" rel="stylesheet"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="../components/web/inputs.css"><style>
.input-lab{gap:24px}.input-lab section{display:grid;gap:16px;min-width:0}.input-lab h2{font-size:calc(var(--hj-font-section)*var(--text-scale,1));margin:0}.input-lab textarea{width:100%;min-height:96px;resize:vertical}.input-lab .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.input-lab .message{min-height:24px;font-size:calc(var(--hj-font-small)*var(--text-scale,1));margin:0}.input-lab label{display:grid;gap:10px}.input-lab section+section{padding-top:24px;border-top:1px solid var(--hj-line)}.input-lab .muted{margin:0}.input-lab footer{font-size:var(--hj-font-small)}
</style><script type="module" src="inputs-lab.js"></script></head><body><div class="shell"><nav class="toolbar" aria-label="输入检查台设置"><span id="source-status">正在读取共同源…</span><button id="mode"><span class="surface">切换深色</span></button><button id="scale"><span class="surface">字号 125%</span></button><button id="reduce" aria-pressed="false"><span class="surface">减少动态</span></button></nav>
<main class="card input-lab"><h1>输入与验证码</h1><p class="muted">文字留在原位，反馈跟随操作。两组示例均为本地模拟。</p><div class="row" role="group" aria-label="输入状态"><button id="disabled" aria-pressed="false"><span class="surface">禁用输入</span></button><button id="readonly" aria-pressed="false"><span class="surface">只读输入</span></button><button id="fail-next" aria-pressed="false"><span class="surface">模拟请求失败</span></button></div>
<section aria-labelledby="note-title"><h2 id="note-title">普通输入</h2><label for="note">开播备注<textarea id="note" rows="3" placeholder="例如：今晚先聊新歌，再和大家玩点歌。"></textarea></label><div class="row"><button id="save-note" class="primary"><span class="surface">本地保存备注</span></button><span class="muted">保存失败时保留输入，可直接重试。</span></div><p id="note-message" class="message" role="status"></p></section>
<section aria-labelledby="otp-title"><h2 id="otp-title">验证码 · 独立示例</h2><p id="otp-help" class="muted">演示码 123456。可逐位输入或粘贴整段，不发送短信。</p><div id="otp" aria-label="六位验证码"></div><div class="row"><button id="verify" class="primary"><span class="surface">本地验证</span></button><button id="clear"><span class="surface">清空验证码</span></button></div><p id="otp-message" class="message" role="status"></p></section><footer class="muted">华年集出品 · 公共输入行为</footer></main></div></body></html>
